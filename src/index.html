<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>African Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>African Tetris</h1>
        </header>
        
        <main class="game-layout">
            <aside class="panel left-panel">
                <div class="stats-box">
                    <h2>Score</h2>
                    <p id="score">0</p>
                </div>
                <div class="stats-box">
                    <h2>High Score</h2>
                    <p id="high-score">0</p>
                </div>
                <div class="stats-box">
                    <h2>Level</h2>
                    <p id="level">1</p>
                </div>
                <div class="stats-box leaderboard-box">
                    <h2>Top 5</h2>
                    <ol id="leaderboard-list"></ol>
                </div>
            </aside>
            
            <section class="board-container">
                <div id="board" class="board"></div>
                <div id="overlay" class="overlay show">
                    <h2 id="overlay-title">African Tetris</h2>
                    <button id="overlay-btn" class="btn">Start Game</button>
                </div>
            </section>
            
            <aside class="panel right-panel">
                <div class="next-piece-box">
                    <h2>Next</h2>
                    <div id="next-piece-grid" class="next-piece-grid"></div>
                </div>
                
                <div class="controls-info">
                    <h2>Controls</h2>
                    <ul>
                        <li><kbd>←</kbd> <kbd>→</kbd> Move</li>
                        <li><kbd>↑</kbd> Rotate</li>
                        <li><kbd>↓</kbd> Soft Drop</li>
                        <li><kbd>Space</kbd> Hard Drop</li>
                        <li><kbd>P</kbd> Pause</li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
